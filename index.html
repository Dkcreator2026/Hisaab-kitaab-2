<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Khata - Hisaab Kitaab</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f8fafc;
    }
    button, input, select { font: inherit; }
    .glass {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
    }
    .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- =========================================================
       FIREBASE CONFIGURATION
       Replace ONLY the values below with your Firebase project
       configuration from Firebase Console.
       ========================================================= -->
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.firebasestorage.app",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
  </script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      setDoc,
      getDoc,
      getDocs,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseKhata = {
      app,
      auth,
      db,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut,
      collection,
      addDoc,
      doc,
      setDoc,
      getDoc,
      getDocs,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      onSnapshot,
      serverTimestamp
    };

    window.dispatchEvent(new Event("firebase-ready"));
  </script>

  <script type="text/babel">
    const {
      useState,
      useEffect,
      useMemo
    } = React;

    const ADMIN_EMAIL = "YOUR_ADMIN_EMAIL@example.com";

    const money = (value) =>
      new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(Number(value || 0));

    const dateText = (timestamp) => {
      if (!timestamp) return "—";

      let date;

      if (timestamp?.toDate) {
        date = timestamp.toDate();
      } else if (timestamp instanceof Date) {
        date = timestamp;
      } else {
        date = new Date(timestamp);
      }

      if (Number.isNaN(date.getTime())) return "—";

      return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    };

    const dateTimeText = (timestamp) => {
      if (!timestamp) return "—";

      let date;

      if (timestamp?.toDate) date = timestamp.toDate();
      else date = new Date(timestamp);

      if (Number.isNaN(date.getTime())) return "—");

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    };

    function Icon({ name, size = 20 }) {
      const icons = {
        logo: (
          <>
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <path d="M7 8h10M7 12h10M7 16h6"/>
          </>
        ),
        user: (
          <>
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/>
          </>
        ),
        users: (
          <>
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </>
        ),
        plus: <><path d="M12 5v14M5 12h14"/></>,
        minus: <><path d="M5 12h14"/></>,
        arrowUp: <><path d="M12 19V5M5 12l7-7 7 7"/></>,
        arrowDown: <><path d="M12 5v14M19 12l-7 7-7-7"/></>,
        whatsapp: (
          <>
            <path d="M20.5 11.1a8.5 8.5 0 0 1-12.6 7.4L4 20l1.5-3.7A8.5 8.5 0 1 1 20.5 11.1Z"/>
            <path d="M8.2 8.2c.2-.5.5-.5.8-.5h.6c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.6.7c.7 1.2 1.6 2 2.8 2.6l.7-.7c.2-.2.4-.2.7-.1l1.8.8c.3.1.4.3.4.5v.6c0 .3-.1.6-.5.8-.4.2-1 .3-1.5.2-2.7-.7-5.8-3.7-6.8-6.1-.2-.5-.1-1.1.1-1.6Z"/>
          </>
        ),
        logout: (
          <>
            <path d="M10 17l5-5-5-5"/>
            <path d="M15 12H3"/>
            <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>
          </>
        ),
        search: (
          <>
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </>
        ),
        eye: (
          <>
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </>
        ),
        close: <><path d="M6 6l12 12M18 6 6 18"/></>,
        check: <><path d="m5 12 4 4L19 6"/></>,
        trash: (
          <>
            <path d="M3 6h18"/>
            <path d="M8 6V4h8v2"/>
            <path d="m19 6-1 15H6L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </>
        ),
        edit: (
          <>
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
          </>
        ),
        back: <><path d="m15 18-6-6 6-6"/></>,
        phone: (
          <>
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.9.6 2.9.7A2 2 0 0 1 22 16.9Z"/>
          </>
        ),
        book: (
          <>
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5Z"/>
            <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/>
          </>
        ),
        refresh: (
          <>
            <path d="M20 11a8.1 8.1 0 0 0-14.8-4L3 10"/>
            <path d="M3 4v6h6"/>
            <path d="M4 13a8.1 8.1 0 0 0 14.8 4L21 14"/>
            <path d="M21 20v-6h-6"/>
          </>
        )
      };

      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          {icons[name] || icons.logo}
        </svg>
      );
    }

    function Loading({ text = "Loading..." }) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center gap-3 bg-slate-50">
          <div className="spinner"></div>
          <p className="text-sm text-slate-500">{text}</p>
        </div>
      );
    }

    function Toast({ message, type, onClose }) {
      if (!message) return null;

      return (
        <div className="fixed z-[100] top-5 right-5 left-5 sm:left-auto max-w-sm">
          <div className={`rounded-2xl px-4 py-3 shadow-xl border flex items-start gap-3 ${
            type === "error"
              ? "bg-red-50 border-red-200 text-red-800"
              : "bg-emerald-50 border-emerald-200 text-emerald-800"
          }`}>
            <div className="mt-0.5">
              <Icon name={type === "error" ? "close" : "check"} size={18}/>
            </div>
            <div className="flex-1 text-sm font-medium">{message}</div>
            <button onClick={onClose} className="opacity-60 hover:opacity-100">
              <Icon name="close" size={16}/>
            </button>
          </div>
        </div>
      );
    }

    function LoginScreen({ onLogin, error, loading }) {
      const [mode, setMode] = useState("member");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");

      const submit = async (e) => {
        e.preventDefault();
        await onLogin(email.trim(), password, mode);
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-100 flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            <div className="text-center mb-7">
              <div className="mx-auto w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-200">
                <Icon name="book" size={32}/>
              </div>
              <h1 className="mt-4 text-3xl font-extrabold text-slate-900">
                Digital Khata
              </h1>
              <p className="text-slate-500 mt-1">Hisaab-Kitaab, simple aur secure</p>
            </div>

            <div className="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8">
              <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl mb-6">
                <button
                  type="button"
                  onClick={() => setMode("member")}
                  className={`py-2.5 rounded-lg text-sm font-bold transition ${
                    mode === "member"
                      ? "bg-white text-blue-700 shadow-sm"
                      : "text-slate-500"
                  }`}
                >
                  Member Login
                </button>
                <button
                  type="button"
                  onClick={() => setMode("admin")}
                  className={`py-2.5 rounded-lg text-sm font-bold transition ${
                    mode === "admin"
                      ? "bg-white text-blue-700 shadow-sm"
                      : "text-slate-500"
                  }`}
                >
                  Admin Login
                </button>
              </div>

              <form onSubmit={submit} className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-1.5">
                    Email
                  </label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    placeholder="Enter email"
                    className="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-1.5">
                    Password
                  </label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="Enter password"
                    className="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
                  />
                </div>

                {error && (
                  <div className="rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm p-3">
                    {error}
                  </div>
                )}

                <button
                  disabled={loading}
                  className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2"
                >
                  {loading && <div className="spinner !border-blue-300 !border-t-white"></div>}
                  {loading ? "Signing in..." : `Login as ${mode === "admin" ? "Admin" : "Member"}`}
                </button>
              </form>

              <p className="text-xs text-slate-400 text-center mt-5">
                Your data is stored securely in Firebase.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function AdminDashboard({ user, onLogout }) {
      const [members, setMembers] = useState([]);
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedMember, setSelectedMember] = useState(null);
      const [showMemberModal, setShowMemberModal] = useState(false);
      const [showEntryModal, setShowEntryModal] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [search, setSearch] = useState("");
      const [toast, setToast] = useState({ message: "", type: "" });
      const [detailLoading, setDetailLoading] = useState(false);

      const db = window.firebaseKhata.db;
      const f = window.firebaseKhata;

      const notify = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: "", type: "" }), 3500);
      };

      useEffect(() => {
        if (!db) return;

        const unsubMembers = f.onSnapshot(
          f.collection(db, "members"),
          snap => {
            const data = snap.docs.map(d => ({
              id: d.id,
              ...d.data()
            }));

            data.sort((a, b) =>
              String(a.name || "").localeCompare(String(b.name || ""))
            );

            setMembers(data);
            setLoading(false);
          },
          err => {
            console.error(err);
            setLoading(false);
            notify("Members load nahi ho paaye.", "error");
          }
        );

        const unsubEntries = f.onSnapshot(
          f.collection(db, "entries"),
          snap => {
            setEntries(
              snap.docs.map(d => ({
                id: d.id,
                ...d.data()
              }))
            );
          },
          err => {
            console.error(err);
          }
        );

        return () => {
          unsubMembers();
          unsubEntries();
        };
      }, []);

      const memberStats = useMemo(() => {
        const stats = {};

        members.forEach(m => {
          stats[m.id] = {
            given: 0,
            received: 0,
            balance: 0
          };
        });

        entries.forEach(e => {
          if (!stats[e.memberId]) return;

          const amount = Number(e.amount || 0);

          if (e.type === "given") {
            stats[e.memberId].given += amount;
          } else if (e.type === "received") {
            stats[e.memberId].received += amount;
          }

          stats[e.memberId].balance =
            stats[e.memberId].given - stats[e.memberId].received;
        });

        return stats;
      }, [members, entries]);

      const filteredMembers = useMemo(() => {
        const q = search.trim().toLowerCase();

        if (!q) return members;

        return members.filter(m =>
          String(m.name || "").toLowerCase().includes(q) ||
          String(m.phone || "").toLowerCase().includes(q) ||
          String(m.email || "").toLowerCase().includes(q)
        );
      }, [members, search]);

      const totals = useMemo(() => {
        let given = 0;
        let received = 0;

        Object.values(memberStats).forEach(s => {
          given += s.given;
          received += s.received;
        });

        return {
          given,
          received,
          balance: given - received
        };
      }, [memberStats]);

      const openMember = (member) => {
        setSelectedMember(member);
      };

      const openAddEntry = (member) => {
        setSelectedMember(member);
        setShowEntryModal(true);
      };

      const handleSaveMember = async (form) => {
        try {
          if (editingMember) {
            await f.updateDoc(
              f.doc(db, "members", editingMember.id),
              {
                name: form.name,
                phone: form.phone,
                email: form.email,
                updatedAt: f.serverTimestamp()
              }
            );
            notify("Member update ho gaya.");
          } else {
            await f.addDoc(
              f.collection(db, "members"),
              {
                name: form.name,
                phone: form.phone,
                email: form.email,
                createdAt: f.serverTimestamp(),
                createdBy: user.uid
              }
            );
            notify("Naya member add ho gaya.");
          }

          setShowMemberModal(false);
          setEditingMember(null);
        } catch (err) {
          console.error(err);
          notify("Member save nahi ho paaya: " + (err.message || ""), "error");
        }
      };

      const handleSaveEntry = async (form) => {
        try {
          await f.addDoc(
            f.collection(db, "entries"),
            {
              memberId: selectedMember.id,
              type: form.type,
              amount: Number(form.amount),
              note: form.note,
              date: form.date,
              createdAt: f.serverTimestamp(),
              createdBy: user.uid
            }
          );

          setShowEntryModal(false);
          notify("Khate mein entry add ho gayi.");
        } catch (err) {
          console.error(err);
          notify("Entry save nahi ho paayi: " + (err.message || ""), "error");
        }
      };

      const deleteEntry = async (entry) => {
        if (!confirm("Kya aap is entry ko delete karna chahte hain?")) return;

        try {
          await f.deleteDoc(f.doc(db, "entries", entry.id));
          notify("Entry delete ho gayi.");
        } catch (err) {
          console.error(err);
          notify("Entry delete nahi ho paayi.", "error");
        }
      };

      const deleteMember = async (member) => {
        if (
          !confirm(
            `Kya aap "${member.name}" ko delete karna chahte hain? Isse member record delete hoga.`
          )
        ) return;

        try {
          const memberEntries = entries.filter(e => e.memberId === member.id);

          await Promise.all(
            memberEntries.map(e =>
              f.deleteDoc(f.doc(db, "entries", e.id))
            )
          );

          await f.deleteDoc(f.doc(db, "members", member.id));

          if (selectedMember?.id === member.id) {
            setSelectedMember(null);
          }

          notify("Member delete ho gaya.");
        } catch (err) {
          console.error(err);
          notify("Member delete nahi ho paaya.", "error");
        }
      };

      const whatsapp = (member) => {
        const stat = memberStats[member.id] || {
          given: 0,
          received: 0,
          balance: 0
        };

        if (!member.phone) {
          notify("Is member ka mobile number available nahi hai.", "error");
          return;
        }

        let message = `Namaste ${member.name},%0A%0A`;
        message += `Aapka Digital Khata statement:%0A`;
        message += `Maine diye: ${money(stat.given)}%0A`;
        message += `Mujhe mile: ${money(stat.received)}%0A`;

        if (stat.balance > 0) {
          message += `%0AAbhi ${money(stat.balance)} aapko dene hain.`;
        } else if (stat.balance < 0) {
          message += `%0AAbhi ${money(Math.abs(stat.balance))} aapse lene hain.`;
        } else {
          message += `%0AAbhi hisaab barabar hai.`;
        }

        message += `%0A%0A— Digital Khata`;

        let phone = String(member.phone).replace(/\D/g, "");

        if (phone.length === 10) {
          phone = "91" + phone;
        }

        window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
      };

      const selectedEntries = selectedMember
        ? entries
            .filter(e => e.memberId === selectedMember.id)
            .sort((a, b) => {
              const ad = a.createdAt?.seconds || 0;
              const bd = b.createdAt?.seconds || 0;
              return bd - ad;
            })
        : [];

      if (loading) return <Loading text="Admin dashboard load ho raha hai..." />;

      return (
        <div className="min-h-screen bg-slate-50">
          <Toast
            message={toast.message}
            type={toast.type}
            onClose={() => setToast({ message: "", type: "" })}
          />

          <header className="sticky top-0 z-30 bg-white border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                  <Icon name="book" size={23}/>
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 leading-tight">
                    Digital Khata
                  </h1>
                  <p className="text-xs text-slate-500">Admin Dashboard</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className="hidden sm:block text-right mr-2">
                  <p className="text-sm font-bold text-slate-800">{user.email}</p>
                  <p className="text-xs text-slate-500">Administrator</p>
                </div>
                <button
                  onClick={onLogout}
                  className="p-2.5 rounded-xl text-slate-500 hover:bg-slate-100"
                  title="Logout"
                >
                  <Icon name="logout" size={20}/>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-4 sm:p-6">
            <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">
              <div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">
                  Hisaab-Kitaab
                </h2>
                <p className="text-slate-500 mt-1">
                  Sabhi members ka khata ek jagah manage karein.
                </p>
              </div>

              <button
                onClick={() => {
                  setEditingMember(null);
                  setShowMemberModal(true);
                }}
                className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-sm"
              >
                <Icon name="plus" size={19}/>
                Naya Member
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
              <StatCard
                title="Maine Diye"
                value={money(totals.given)}
                icon="arrowUp"
                tone="blue"
              />
              <StatCard
                title="Mujhe Mile"
                value={money(totals.received)}
                icon="arrowDown"
                tone="emerald"
              />
              <StatCard
                title="Net Balance"
                value={money(Math.abs(totals.balance))}
                subtitle={
                  totals.balance > 0
                    ? "Total mujhe lene hain"
                    : totals.balance < 0
                    ? "Total mujhe dene hain"
                    : "Hisaab barabar"
                }
                icon="book"
                tone={totals.balance > 0 ? "amber" : "slate"}
              />
            </div>

    function MemberPassbook({ user, member, onLogout }) {
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      const db = window.firebaseKhata;
      
      useEffect(() => {
        if (!member?.id) {
          setError("Aapka member record nahi mila.");
          setLoading(false);
          return;
        }

        const q = db.query(
          db.collection(db.db, "entries"),
          db.where("memberId", "==", member.id)
        );

        const unsub = db.onSnapshot(
          q,
          snap => {
            const list = snap.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .sort((a, b) => {
                const ad = a.createdAt?.seconds || 0;
                const bd = b.createdAt?.seconds || 0;
                return bd - ad;
              });

            setEntries(list);
            setLoading(false);
          },
          err => {
            console.error(err);
            setError("Aapka hisaab load nahi ho paaya.");
            setLoading(false);
          }
        );

        return () => unsub();
      }, [member?.id]);

      const stats = useMemo(() => {
        let given = 0;
        let received = 0;

        entries.forEach(e => {
          if (e.type === "given") given += Number(e.amount || 0);
          if (e.type === "received") received += Number(e.amount || 0);
        });

        return {
          given,
          received,
          balance: given - received
        };
      }, [entries]);

      if (loading) {
        return <Loading text="Aapka passbook load ho raha hai..." />;
      }

      return (
        <div className="min-h-screen bg-slate-50">
          <header className="bg-white border-b border-slate-200">
            <div className="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                  <Icon name="book" size={21}/>
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900">Digital Khata</h1>
                  <p className="text-xs text-slate-500">My Passbook</p>
                </div>
              </div>

              <button
                onClick={onLogout}
                className="p-2.5 rounded-xl hover:bg-slate-100 text-slate-500"
                title="Logout"
              >
                <Icon name="logout" size={19}/>
              </button>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-4 sm:p-6">
            {error ? (
              <div className="bg-red-50 border border-red-200 rounded-2xl p-5 text-red-700">
                {error}
              </div>
            ) : (
              <>
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-5">
                  <div className="flex items-center gap-3">
                    <Avatar name={member.name}/>
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900">
                        {member.name}
                      </h2>
                      <p className="text-sm text-slate-500">
                        Aapka personal khata
                      </p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
                  <StatCard
                    title="Maine Diye"
                    value={money(stats.given)}
                    icon="arrowUp"
                    tone="blue"
                  />
                  <StatCard
                    title="Mujhe Mile"
                    value={money(stats.received)}
                    icon="arrowDown"
                    tone="emerald"
                  />
                  <StatCard
                    title="Net Balance"
                    value={money(Math.abs(stats.balance))}
                    subtitle={
                      stats.balance > 0
                        ? "Lene hain"
                        : stats.balance < 0
                        ? "Dene hain"
                        : "Hisaab barabar"
                    }
                    icon="book"
                    tone="slate"
                  />
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-5 py-4 border-b border-slate-100">
                    <h3 className="font-extrabold text-lg text-slate-900">
                      Transaction History
                    </h3>
                  </div>

                  {entries.length === 0 ? (
                    <EmptyState
                      title="Abhi koi entry nahi hai"
                      text="Aapke khate mein abhi koi transaction record nahi hai."
                    />
                  ) : (
                    <div className="divide-y divide-slate-100">
                      {entries.map(entry => (
                        <div
                          key={entry.id}
                          className="p-4 sm:p-5 flex items-center justify-between gap-3"
                        >
                          <div className="flex items-center gap-3 min-w-0">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                              entry.type === "given"
                                ? "bg-blue-50 text-blue-600"
                                : "bg-emerald-50 text-emerald-600"
                            }`}>
                              <Icon
                                name={entry.type === "given" ? "arrowUp" : "arrowDown"}
                                size={19}
                              />
                            </div>

                            <div className="min-w-0">
                              <p className="font-bold text-slate-800">
                                {entry.type === "given"
                                  ? "Maine Diye"
                                  : "Mujhe Mile"}
                              </p>
                              <p className="text-xs text-slate-500 truncate">
                                {entry.note || "No note"}
                              </p>
                              <p className="text-xs text-slate-400 mt-0.5">
                                {entry.date || dateText(entry.createdAt)}
                              </p>
                            </div>
                          </div>

                          <div className={`font-extrabold text-base sm:text-lg shrink-0 ${
                            entry.type === "given"
                              ? "text-blue-700"
                              : "text-emerald-700"
                          }`}>
                            {money(entry.amount)}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </>
            )}
          </main>
        </div>
      );
    }

    function App() {
      const [firebaseReady, setFirebaseReady] = useState(
        !!window.firebaseKhata
      );
      const [user, setUser] = useState(null);
      const [member, setMember] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState("");

      useEffect(() => {
        const ready = () => setFirebaseReady(true);

        window.addEventListener("firebase-ready", ready);

        if (window.firebaseKhata) {
          setFirebaseReady(true);
        }

        return () => window.removeEventListener("firebase-ready", ready);
      }, []);

      useEffect(() => {
        if (!firebaseReady || !window.firebaseKhata) return;

        const {
          auth,
          onAuthStateChanged
        } = window.firebaseKhata;

        const unsubscribe = onAuthStateChanged(auth, async currentUser => {
          setUser(currentUser);

          if (!currentUser) {
            setMember(null);
            setAuthLoading(false);
            return;
          }

          if (
            currentUser.email &&
            currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
          ) {
            setMember(null);
            setAuthLoading(false);
            return;
          }

          try {
            const f = window.firebaseKhata;
            const q = f.query(
              f.collection(f.db, "members"),
              f.where("email", "==", currentUser.email)
            );

            const snap = await f.getDocs(q);

            if (!snap.empty) {
              const d = snap.docs[0];

              setMember({
                id: d.id,
                ...d.data()
              });
            } else {
              setMember(null);
            }
          } catch (err) {
            console.error(err);
            setMember(null);
          }

          setAuthLoading(false);
        });

        return () => unsubscribe();
      }, [firebaseReady]);

      const login = async (email, password, mode) => {
        setLoginError("");
        setLoginLoading(true);

        try {
          const f = window.firebaseKhata;

          if (
            mode === "admin" &&
            email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
          ) {
            throw new Error("Admin email galat hai.");
          }

          await f.signInWithEmailAndPassword(
            f.auth,
            email,
            password
          );
        } catch (err) {
          console.error(err);

          const messages = {
            "auth/invalid-credential": "Email ya password galat hai.",
            "auth/invalid-email": "Email address sahi nahi hai.",
            "auth/user-not-found": "Ye account nahi mila.",
            "auth/wrong-password": "Password galat hai.",
            "auth/too-many-requests": "Bahut attempts ho gaye. Thodi der baad try karein."
          };

          setLoginError(
            messages[err.code] ||
            err.message ||
            "Login nahi ho paaya."
          );
        } finally {
          setLoginLoading(false);
        }
      };

      const logout = async () => {
        await window.firebaseKhata.signOut(
          window.firebaseKhata.auth
        );
      };

      if (!firebaseReady || authLoading) {
        return <Loading text="Digital Khata start ho raha hai..." />;
      }

      if (!user) {
        return (
          <LoginScreen
            onLogin={login}
            error={loginError}
            loading={loginLoading}
          />
        );
      }

      const isAdmin =
        user.email &&
        user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      if (isAdmin) {
        return (
          <AdminDashboard
            user={user}
            onLogout={logout}
          />
        );
      }

      if (!member) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <div className="bg-white max-w-md w-full rounded-3xl shadow-xl border border-slate-200 p-7 text-center">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center">
                <Icon name="user" size={27}/>
              </div>
              <h2 className="text-xl font-extrabold text-slate-900 mt-4">
                Member record nahi mila
              </h2>
              <p className="text-sm text-slate-500 mt-2">
                Is email ko Admin ne kisi member ke khate se link nahi kiya hai.
              </p>
              <button
                onClick={logout}
                className="mt-5 px-5 py-3 rounded-xl bg-slate-900 text-white font-bold"
              >
                Logout
              </button>
            </div>
          </div>
        );
      }

      return (
        <MemberPassbook
          user={user}
          member={member}
          onLogout={logout}
        />
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);
  </script>
</body>
</html>
