    const firebaseConfig = {

      messagingSenderId: "238999762218",

    };

    const ADMIN_EMAIL = "dk7508592@gmail.com";

    /* =========================================================

    if (!firebase.apps.length) {

    const auth = firebase.auth();

    const {

    /* =========================================================
       HELPERS
       ========================================================= */

    function money(value) {
      const amount = Number(value || 0);

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(amount);
    }

    function formatDate(timestamp) {
      if (!timestamp) return "-";

      const date = new Date(Number(timestamp));

      if (Number.isNaN(date.getTime())) return "-";

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function dateOnly(timestamp) {
      if (!timestamp) return "-";

      const date = new Date(Number(timestamp));

      if (Number.isNaN(date.getTime())) return "-";

      return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function normalizeEmail(email) {
      return String(email || "").trim().toLowerCase();
    }

    function sanitizePhone(phone) {
      return String(phone || "").replace(/\D/g, "");
    }

    function escapeWhatsAppText(text) {
      return encodeURIComponent(text);
    }

    function generateWhatsAppLink(member, summary) {
      const phone = sanitizePhone(member.phone);

      if (!phone) return null;

      let message = `Namaste ${member.name || ""},%0A%0A`;

      if (summary.balance > 0) {
        message += `Aapke hisaab ke mutabik aapko ₹${summary.balance.toFixed(2)} dene hain.`;
      } else if (summary.balance < 0) {
        message += `Aapke hisaab ke mutabik aapko ₹${Math.abs(summary.balance).toFixed(2)} lene hain.`;
      } else {
        message += `Aapka hisaab filhaal barabar hai.`;
      }

      message += `%0A%0A`;
      message += `Maine diye: ₹${summary.given.toFixed(2)}%0A`;
      message += `Mujhe mile: ₹${summary.received.toFixed(2)}%0A`;
      message += `Net balance: ₹${Math.abs(summary.balance).toFixed(2)}%0A%0A`;
      message += `Dhanyavaad.`;

      const countryPhone =
        phone.startsWith("91") ? phone : "91" + phone;

      return `https://wa.me/${countryPhone}?text=${message}`;
    }

    function calculateSummary(entries) {
      let given = 0;
      let received = 0;

      entries.forEach(entry => {
        const amount = Number(entry.amount || 0);

        if (entry.type === "given") {
          given += amount;
        }

        if (entry.type === "received") {
          received += amount;
        }
      });

      /*
        Positive = member ko dena hai
        Negative = member se lena hai
      */
      const balance = given - received;

      return {
        given,
        received,
        balance
      };
    }

    function getInitials(name) {
      const value = String(name || "U").trim();

      if (!value) return "U";

      const parts = value.split(/\s+/);

      if (parts.length === 1) {
        return parts[0].slice(0, 2).toUpperCase();
      }

      return (
        parts[0][0] +
        parts[parts.length - 1][0]
      ).toUpperCase();
    }

    function friendlyFirebaseError(error) {
      const code = error?.code || "";

      const messages = {
        "auth/invalid-credential":
          "Email ya password galat hai.",
        "auth/invalid-login-credentials":
          "Email ya password galat hai.",
        "auth/user-not-found":
          "Is email ka Firebase account nahi mila.",
        "auth/wrong-password":
          "Password galat hai.",
        "auth/email-already-in-use":
          "Ye email pehle se registered hai.",
        "auth/weak-password":
          "Password kam se kam 6 characters ka hona chahiye.",
        "auth/invalid-email":
          "Email address sahi nahi hai.",
        "auth/network-request-failed":
          "Internet connection check kijiye.",
        "PERMISSION_DENIED":
          "Firebase Realtime Database Rules ne access deny kiya hai."
      };

      return messages[code] || error?.message || "Kuch galat ho gaya.";
    }

    /* =========================================================
       LOADING
       ========================================================= */

    function LoadingScreen({ text = "Loading..." }) {
      return (
        <div className="min-h-screen flex items-center justify-center gradient-bg">
          <div className="text-center">
            <div className="spinner mx-auto mb-4"></div>
            <p className="text-slate-600 font-medium">{text}</p>
          </div>
        </div>
      );
    }

    /* =========================================================
       TOAST
       ========================================================= */

    function Toast({ toast, onClose }) {
      if (!toast) return null;

      const success = toast.type === "success";

      return (
        <div className="fixed top-4 right-4 z-[100] max-w-sm fade-in">
          <div
            className={
              "rounded-2xl px-4 py-3 shadow-xl border " +
              (success
                ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                : "bg-red-50 border-red-200 text-red-800")
            }
          >
            <div className="flex items-start gap-3">
              <div className="text-xl">
                {success ? "✓" : "!"}
              </div>

              <div className="flex-1">
                <div className="font-semibold">
                  {success ? "Success" : "Error"}
                </div>

                <div className="text-sm mt-0.5">
                  {toast.message}
                </div>
              </div>

              <button
                onClick={onClose}
                className="text-slate-400 hover:text-slate-700"
              >
                ×
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       LOGIN
       ========================================================= */

    function LoginScreen({ onToast }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);

      async function handleLogin(event) {
        event.preventDefault();

        const cleanEmail = normalizeEmail(email);

        if (!cleanEmail) {
          onToast("error", "Email enter kijiye.");
          return;
        }

        if (!password) {
          onToast("error", "Password enter kijiye.");
          return;
        }

        setLoading(true);

        try {
          await auth.signInWithEmailAndPassword(
            cleanEmail,
            password
          );
        } catch (error) {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-slate-900 text-white text-3xl shadow-xl mb-4">
                ₹
              </div>

              <h1 className="text-3xl font-black text-slate-900">
                Digital Khata
              </h1>

              <p className="text-slate-500 mt-2">
                Hisaab-Kitaab Management System
              </p>
            </div>

            <div className="bg-white rounded-3xl p-6 sm:p-8 card-shadow border border-slate-100">
              <h2 className="text-xl font-bold text-slate-900">
                Login
              </h2>

              <p className="text-sm text-slate-500 mt-1 mb-6">
                Apne account se login kijiye.
              </p>

              <form
                onSubmit={handleLogin}
                className="space-y-5"
              >
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">
                    Email
                  </label>

                  <input
                    type="email"
                    autoComplete="email"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    placeholder="example@email.com"
                    className="w-full rounded-2xl border border-slate-200 px-4 py-3.5 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">
                    Password
                  </label>

                  <div className="relative">
                    <input
                      type={
                        showPassword
                          ? "text"
                          : "password"
                      }
                      autoComplete="current-password"
                      value={password}
                      onChange={e => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full rounded-2xl border border-slate-200 px-4 py-3.5 pr-14 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />

                    <button
                      type="button"
                      onClick={() =>
                        setShowPassword(!showPassword)
                      }
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 px-2"
                    >
                      {showPassword ? "Hide" : "Show"}
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full rounded-2xl bg-slate-900 hover:bg-slate-800 disabled:opacity-60 text-white font-bold py-3.5 transition"
                >
                  {loading ? (
                    <span className="flex items-center justify-center gap-2">
                      <span className="spinner !w-5 !h-5 !border-slate-600 !border-t-white"></span>
                      Login ho raha hai...
                    </span>
                  ) : (
                    "Login"
                  )}
                </button>
              </form>

              <div className="mt-6 p-4 rounded-2xl bg-blue-50 border border-blue-100 text-sm text-blue-800">
                <b>Admin:</b> {ADMIN_EMAIL}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================

    /* =========================================================
       ADD MEMBER MODAL

              <div>
                <label className="block text-sm font-semibold mb-2">

                <input

                  onChange={e =>
                    update("name", e.target.value)

              <div>

    /* =========================================================
       ADD ENTRY MODAL
       ========================================================= */

    function AddEntryModal({
      members,
      onClose,
      onSave,
      saving
    }) {
      const [form, setForm] = useState({
        memberUid: "",
        amount: "",
        type: "given",
        note: ""

      function update(key, value) {
        setForm(prev => ({
          ...prev,
          [key]: value
        }));
      }

      function submit(event) {
        event.preventDefault();

        const amount = Number(form.amount);

        if (!form.memberUid) {
          alert("Member select kijiye.");
          return;
        }

        if (!amount || amount <= 0) {
          alert("Valid amount enter kijiye.");
          return;
        }

        onSave({

          note: form.note.trim()

      return (

                  Add Hisaab Entry

                <p className="text-sm text-slate-500 mt-1">
                  Naya transaction add karein.

              </div>

                ×

              className="p-5 space-y-4"

                    onClick={() =>
                      update("type", "received")

                >
                  {saving ? "Saving..." : "Save Entry"}

            </form>
          </div>
        </div>
      );

    /* =========================================================
       ADMIN DASHBOARD
       ========================================================= */

    function AdminDashboard({
      user,
      onLogout,
      onToast
    }) {
      const [members, setMembers] = useState([]);
      const [entries, setEntries] = useState([]);

      const [loading, setLoading] = useState(true);
      const [memberModal, setMemberModal] = useState(false);
      const [entryModal, setEntryModal] = useState(false);
      const [saving, setSaving] = useState(false);
      const [search, setSearch] = useState("");

      const [activeTab, setActiveTab] =
        useState("members");

      /* -----------------------------------------
         REALTIME MEMBERS
         ----------------------------------------- */

      useEffect(() => {
        const ref = db.ref("members");

        const handler = snapshot => {
          const data = snapshot.val() || {};

          const list = Object.entries(data)
            .map(([uid, value]) => ({
              uid,
              ...value
            }))
            .sort((a, b) =>
              String(a.name || "").localeCompare(
                String(b.name || "")
              )
            );

          setMembers(list);
          setLoading(false);
        };

        const errorHandler = error => {
          setLoading(false);

          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        };

        ref.on("value", handler, errorHandler);

        return () => {
          ref.off("value", handler);
        };
      }, []);

      /* -----------------------------------------
         REALTIME ENTRIES
         ----------------------------------------- */

      useEffect(() => {
        const ref = db.ref("entries");

        const handler = snapshot => {
          const data = snapshot.val() || {};

          const list = Object.entries(data)
            .map(([id, value]) => ({
              id,
              ...value
            }))
            .sort(
              (a, b) =>
                Number(b.createdAt || 0) -
                Number(a.createdAt || 0)
            );

          setEntries(list);
        };

        const errorHandler = error => {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        };

        ref.on("value", handler, errorHandler);

        return () => {
          ref.off("value", handler);
        };
      }, []);

      /* -----------------------------------------
         MEMBER SUMMARIES
         ----------------------------------------- */

      const memberSummaries = useMemo(() => {
        const result = {};

        members.forEach(member => {
          result[member.uid] =
            calculateSummary(
              entries.filter(
                entry =>
                  entry.memberUid === member.uid
              )
            );
        });

        return result;
      }, [members, entries]);

      /* -----------------------------------------
         GLOBAL STATS
         ----------------------------------------- */

      const totalGiven = entries
        .filter(e => e.type === "given")
        .reduce(
          (sum, e) => sum + Number(e.amount || 0),
          0
        );

      const totalReceived = entries
        .filter(e => e.type === "received")
        .reduce(
          (sum, e) => sum + Number(e.amount || 0),
          0
        );

      const totalBalance =
        totalGiven - totalReceived;

      const filteredMembers = members.filter(
        member => {
          const text = search
            .trim()
            .toLowerCase();

          if (!text) return true;

          return (
            String(member.name || "")
              .toLowerCase()
              .includes(text) ||
            String(member.email || "")
              .toLowerCase()
              .includes(text) ||
            String(member.phone || "")
              .includes(text)
          );
        }
      );

      /* -----------------------------------------
         ADD MEMBER
         ----------------------------------------- */

      async function saveMember(form) {
        setSaving(true);

        try {
          const memberRef =
            db.ref("members/" + form.uid);

          const existing =
            await memberRef.once("value");

          if (existing.exists()) {
            throw new Error(
              "Is UID ka member already exist karta hai."
            );
          }

          await memberRef.set({
            name: form.name,
            email: normalizeEmail(form.email),
            phone: form.phone || "",
            createdAt: Date.now(),
            createdBy: normalizeEmail(
              user.email
            )
          });

          setMemberModal(false);

          onToast(
            "success",
            "Member successfully add ho gaya."
          );
        } catch (error) {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        } finally {
          setSaving(false);
        }
      }

      /* -----------------------------------------
         ADD ENTRY
         ----------------------------------------- */

      async function saveEntry(form) {
        setSaving(true);

        try {
          const ref = db.ref("entries").push();

          await ref.set({
            memberUid: form.memberUid,
            amount: Number(form.amount),
            type: form.type,
            note: form.note || "",
            createdAt: Date.now(),
            createdBy: normalizeEmail(
              user.email
            )
          });

          setEntryModal(false);

          onToast(
            "success",
            "Hisaab entry successfully save ho gayi."
          );
        } catch (error) {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        } finally {
          setSaving(false);
        }
      }

      /* -----------------------------------------
         DELETE ENTRY
         ----------------------------------------- */

      async function deleteEntry(entry) {
        const ok = window.confirm(
          "Kya aap is transaction ko delete karna chahte hain?"
        );

        if (!ok) return;

        try {
          await db
            .ref("entries/" + entry.id)
            .remove();

          onToast(
            "success",
            "Transaction delete ho gaya."
          );
        } catch (error) {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        }
      }

      /* -----------------------------------------
         DELETE MEMBER
         ----------------------------------------- */

      async function deleteMember(member) {
        const summary =
          memberSummaries[member.uid] ||
          calculateSummary([]);

        const ok = window.confirm(
          `${member.name} ko delete karna hai?\n\nIs member ka profile delete hoga. Existing ledger entries alag se delete karni hongi.`

        try {
          await db
            .ref("members/" + member.uid)
            .remove();

          onToast(
            "success",
            "Member profile delete ho gayi."
          );
        } catch (error) {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        }
      }

      /* -----------------------------------------
         MEMBER NAME
         ----------------------------------------- */

      function memberName(uid) {
        const member = members.find(
          m => m.uid === uid
        );

        return member?.name || "Unknown Member";
      }

      if (loading) {
        return <LoadingScreen text="Dashboard load ho raha hai..." />;

      return (
        <div className="min-h-screen gradient-bg">

            <div className="mb-6">

                  <p className="text-slate-500 mt-1">

                </div>

                <div className="flex gap-2 flex-wrap">
                  <button

                  >
                    + Member
                  </button>

                  <button
                    onClick={() =>

                    disabled={members.length === 0}

                    + Hisaab
                  </button>
                </div>
              </div>
            </div>

            {/* STATS */}

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <StatCard
                title="Total Members"
                value={members.length}
                subtitle="Active member profiles"
                icon="👥"
                type="blue"
              />

              <StatCard
                title="Maine Diye"
                value={money(totalGiven)}

                icon="↗"
                type="red"
              />

              <StatCard
                title="Mujhe Mile"
                value={money(totalReceived)}
                subtitle="Total amount received"

                type="green"
              />

              <StatCard
                title="Net Balance"
                value={money(Math.abs(totalBalance))}
                subtitle={
                  totalBalance > 0
                    ? "Lena hai"
                    : totalBalance < 0
                    ? "Dena hai"
                    : "Barabar"
                }
                icon="₹"
                type="normal"
              />
            </div>

            {/* TABS */}

            <div className="bg-white rounded-2xl border border-slate-200 p-1.5 flex gap-1 mb-5 overflow-x-auto">
              <button
                onClick={() =>
                  setActiveTab("members")
                }
                className={
                  "px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap " +
                  (activeTab === "members"
                    ? "bg-slate-900 text-white"
                    : "text-slate-600 hover:bg-slate-100")
                }
              >
                Members
              </button>

              <button
                onClick={() =>
                  setActiveTab("ledger")
                }
                className={
                  "px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap " +
                  (activeTab === "ledger"
                    ? "bg-slate-900 text-white"
                    : "text-slate-600 hover:bg-slate-100")
                }
              >
                Ledger
              </button>
            </div>

            {/* MEMBERS */}

            {activeTab === "members" && (
              <section className="fade-in">
                <div className="bg-white rounded-3xl border border-slate-200 card-shadow overflow-hidden">
                  <div className="p-5 border-b border-slate-100">
                    <div className="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                      <div>
                        <h3 className="text-xl font-black">
                          Members

                        <p className="text-sm text-slate-500 mt-1">

                      </div>

                      <input

                  {filteredMembers.length === 0 ? (

                              <div className="grid grid-cols-3 gap-3 lg:w-[420px]">

    function MemberPassbook({
      user,
      onLogout,
      onToast
    }) {
      const [member, setMember] = useState(null);
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [notFound, setNotFound] = useState(false);

      /* -----------------------------------------
         MEMBER PROFILE REALTIME
         ----------------------------------------- */

      useEffect(() => {
        if (!user?.uid) return;

        const ref = db.ref(
          "members/" + user.uid
        );

        const handler = snapshot => {
          const value = snapshot.val();

          if (!value) {
            setMember(null);
            setNotFound(true);
          } else {
            setMember({
              uid: user.uid,
              ...value
            });

            setNotFound(false);
          }

          setLoading(false);
        };

        const errorHandler = error => {
          setLoading(false);

          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        };

        ref.on("value", handler, errorHandler);

        return () => {
          ref.off("value", handler);
        };
      }, [user?.uid]);

      /* -----------------------------------------
         MEMBER ENTRIES
         ----------------------------------------- */

      useEffect(() => {
        if (!user?.uid) return;

        const ref = db.ref("entries");

        const handler = snapshot => {
          const data = snapshot.val() || {};

          const list = Object.entries(data)
            .map(([id, value]) => ({
              id,
              ...value
            }))
            .filter(
              entry =>
                entry.memberUid === user.uid
            )
            .sort(
              (a, b) =>
                Number(b.createdAt || 0) -
                Number(a.createdAt || 0)
            );

          setEntries(list);
        };

        const errorHandler = error => {
          onToast(
            "error",
            friendlyFirebaseError(error)
          );
        };

        ref.on("value", handler, errorHandler);

        return () => {
          ref.off("value", handler);
        };
      }, [user?.uid]);

      const summary =
        calculateSummary(entries);

      if (loading) {
        return (
          <LoadingScreen text="Aapki passbook load ho rahi hai..." />

        return (

              user={user}
              title="Digital Khata"
              subtitle="Member Passbook"
              onLogout={onLogout}

            <main className="max-w-xl mx-auto px-4 py-12">
              <div className="bg-white rounded-3xl p-8 card-shadow text-center">
                <div className="text-5xl mb-4">
                  ⚠️
                </div>

                <h2 className="text-xl font-black">
                  Member Profile Nahi Mila
                </h2>

                <p className="text-slate-500 mt-2">
                  Aapka Firebase Auth UID admin ne
                  members list mein add nahi kiya hai.
                </p>
              </div>
            </main>
          </div>
        );

      return (
        <div className="min-h-screen gradient-bg">
          <Header

            title="My Passbook"

            onLogout={onLogout}

            <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 mb-5 overflow-hidden relative">
              <div className="absolute -right-10 -top-10 w-40 h-40 bg-blue-500/20 rounded-full blur-2xl"></div>
              <div className="absolute -left-10 -bottom-10 w-40 h-40 bg-emerald-500/20 rounded-full blur-2xl"></div>

              <div className="relative">
                <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                  <div className="w-16 h-16 rounded-3xl bg-white/10 border border-white/10 flex items-center justify-center text-2xl font-black">
                    {getInitials(
                      member?.name
                    )}
                  </div>

                  <div>
                    <p className="text-slate-400 text-sm">
                      Welcome
                    </p>

                    <h2 className="text-2xl sm:text-3xl font-black">
                      {member?.name}
                    </h2>

                    <p className="text-slate-400 text-sm mt-1">
                      {member?.email}
                    </p>
                  </div>
                </div>
              </div>
            </div>

            {/* SUMMARY */}

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
              <StatCard
                title="Maine Diye"
                value={money(summary.given)}
                subtitle="Total given"
                icon="↗"
                type="red"
              />

              <StatCard
                title="Mujhe Mile"
                value={money(summary.received)}
                subtitle="Total received"
                icon="↙"
                type="green"
              />

              <StatCard
                title={
                  summary.balance > 0
                    ? "Dene Hain"
                    : summary.balance < 0
                    ? "Lene Hain"
                    : "Balance"
                }
                value={money(
                  Math.abs(
                    summary.balance
                  )
                )}
                subtitle={
                  summary.balance === 0
                    ? "Hisaab barabar"
                    : summary.balance > 0
                    ? "Aapko dene hain"
                    : "Aapko lene hain"
                }
                icon="₹"
                type="blue"
              />
            </div>

            {/* STATUS */}

            <div
              className={
                "rounded-3xl p-5 mb-5 border " +
                (summary.balance > 0
                  ? "bg-red-50 border-red-100"
                  : summary.balance < 0
                  ? "bg-emerald-50 border-emerald-100"
                  : "bg-slate-50 border-slate-200")
              }
            >
              {summary.balance > 0 ? (
                <p className="font-bold text-red-700">
                  Aapko{" "}
                  {money(
                    summary.balance
                  )}{" "}
                  dene hain.
                </p>
              ) : summary.balance < 0 ? (
                <p className="font-bold text-emerald-700">
                  Aapko{" "}
                  {money(
                    Math.abs(
                      summary.balance
                    )
                  )}{" "}
                  lene hain.
                </p>
              ) : (
                <p className="font-bold text-slate-700">
                  Aapka hisaab bilkul barabar hai.
                </p>
              )}
            </div>

            {/* PASSBOOK */}

            <div className="bg-white rounded-3xl border border-slate-200 card-shadow overflow-hidden">
              <div className="p-5 border-b border-slate-100">
                <h3 className="text-xl font-black">
                  My Passbook
                </h3>

                <p className="text-sm text-slate-500 mt-1">
                  Transactions realtime update hote hain.
                </p>
              </div>

              {entries.length === 0 ? (
                <div className="p-12 text-center">
                  <div className="text-5xl mb-3">
                    📒
                  </div>

                  <h4 className="font-black text-slate-800">
                    Abhi koi transaction nahi hai
                  </h4>

                  <p className="text-sm text-slate-500 mt-1">
                    Aapka ledger yahan dikhega.
                  </p>
                </div>
              ) : (
                <div className="divide-y divide-slate-100">
                  {entries.map(entry => (
                    <div
                      key={entry.id}
                      className="p-5 hover:bg-slate-50 transition"
                    >
                      <div className="flex items-start justify-between gap-4">
                        <div className="flex gap-3 min-w-0">
                          <div
                            className={
                              "w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 font-black " +
                              (entry.type ===
                              "given"
                                ? "bg-red-100 text-red-700"
                                : "bg-emerald-100 text-emerald-700")
                            }
                          >
                            {entry.type ===
                            "given"
                              ? "↑"
                              : "↓"}
                          </div>

                          <div className="min-w-0">
                            <div className="font-black text-slate-900">
                              {entry.type ===
                              "given"
                                ? "Maine diye"
                                : "Mujhe mile"}
                            </div>

                            <div className="text-xs text-slate-500 mt-1">
                              {formatDate(
                                entry.createdAt
                              )}
                            </div>

                            {entry.note && (
                              <div className="text-sm text-slate-600 mt-2 break-words">
                                {entry.note}
                              </div>
                            )}
                          </div>
                        </div>

                        <div
                          className={
                            "font-black whitespace-nowrap " +
                            (entry.type ===
                            "given"
                              ? "text-red-600"
                              : "text-emerald-600")
                          }
                        >
                          {entry.type ===
                          "given"
                            ? "-"
                            : "+"}
                          {money(entry.amount)}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    /* =========================================================
       APP
       ========================================================= */

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] =
        useState(true);

      const [toast, setToast] =
        useState(null);

      function showToast(type, message) {
        setToast({
          type,
          message
        });

        window.clearTimeout(
          showToast.timeout
        );

        showToast.timeout =
          window.setTimeout(() => {
            setToast(null);
          }, 4000);
      }

      useEffect(() => {
        const unsubscribe =
          auth.onAuthStateChanged(
            currentUser => {
              setUser(currentUser);
              setAuthLoading(false);
            }
          );

        return unsubscribe;
      }, []);

      async function logout() {
        try {
          await auth.signOut();

          showToast(
            "success",
            "Logout successful."
          );
        } catch (error) {
          showToast(
            "error",
            friendlyFirebaseError(error)
          );
        }
      }

      if (authLoading) {
        return (
          <LoadingScreen text="Digital Khata start ho raha hai..." />
        );
      }

      if (!user) {
        return (
          <>
            <LoginScreen
              onToast={showToast}
            />

            <Toast
              toast={toast}
              onClose={() =>
                setToast(null)
              }
            />
          </>
        );
      }

      const isAdmin =
        normalizeEmail(user.email) ===
        ADMIN_EMAIL;

      return (
        <>
          {isAdmin ? (
            <AdminDashboard
              user={user}
              onLogout={logout}
              onToast={showToast}
            />
          ) : (
            <MemberPassbook
              user={user}
              onLogout={logout}
              onToast={showToast}
            />
          )}

          <Toast
            toast={toast}
            onClose={() =>
              setToast(null)
            }
          />
        </>
      );
    }

    /* =========================================================
       START APP
       ========================================================= */

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(
      <App />
    );

  </script>
</body>
</html>
