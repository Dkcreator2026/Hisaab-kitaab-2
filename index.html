function money(value) {
  return new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR",
    maximumFractionDigits: 2
  }).format(Number(value) || 0);
}


function formatDate(timestamp) {

  if (!timestamp) {
    return "—";
  }

  const date = new Date(timestamp);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return new Intl.DateTimeFormat("en-IN", {
    dateStyle: "medium",
    timeStyle: "short"
  }).format(date);
}

/* ======================================================
   ADMIN DASHBOARD
====================================================== */

function AdminDashboard({
  user,
  members,
  entries,
  onLogout,
  reload,
  error,
  setError
}) {

  const [memberName, setMemberName] = useState("");
  const [memberEmail, setMemberEmail] = useState("");

  const [selectedMember, setSelectedMember] = useState("");

  const [amount, setAmount] = useState("");
  const [entryType, setEntryType] = useState("gave");
  const [note, setNote] = useState("");

  const [loading, setLoading] = useState(false);


  function memberStats(memberId) {

    const memberEntries = entries.filter(
      entry => entry.memberId === memberId
    );

    const gave = memberEntries
      .filter(entry => entry.type === "gave")
      .reduce(
        (sum, entry) => sum + Number(entry.amount || 0),
        0
      );

    const got = memberEntries
      .filter(entry => entry.type === "got")
      .reduce(
        (sum, entry) => sum + Number(entry.amount || 0),
        0
      );

    return {
      gave,
      got,
      net: gave - got
    };
  }


  async function addMember(event) {

    event.preventDefault();

    setError("");

    if (!memberName.trim()) {
      setError("Member name डालें.");
      return;
    }

    if (!memberEmail.trim()) {
      setError("Member email डालें.");
      return;
    }

    setLoading(true);

    try {

      const memberRef =
        database.ref("members").push();

      await memberRef.set({
        name: memberName.trim(),
        email: memberEmail.trim().toLowerCase(),
        createdAt: Date.now()
      });

      setMemberName("");
      setMemberEmail("");

      await reload();

    } catch (error) {

      setError(error.message);

    } finally {

      setLoading(false);

    }
  }


  async function addEntry(event) {

    event.preventDefault();

    setError("");

    if (!selectedMember) {
      setError("Member select करें.");
      return;
    }

    if (Number(amount) <= 0) {
      setError("Valid amount डालें.");
      return;
    }

    setLoading(true);

    try {

      const entryRef =
        database.ref("entries").push();

      await entryRef.set({

        memberId: selectedMember,

        amount: Number(amount),

        type: entryType,

        note: note.trim(),

        createdAt: Date.now(),

        createdBy: user.email

      });

      setAmount("");
      setNote("");

      await reload();

    } catch (error) {

      setError(error.message);

    } finally {

      setLoading(false);

    }
  }


  async function deleteEntry(entryId) {

    const confirmed =
      window.confirm("Kya aap ye entry delete karna chahte hain?");

    if (!confirmed) {
      return;
    }

    try {

      await database
        .ref("entries/" + entryId)
        .remove();

      await reload();

    } catch (error) {

      setError(error.message);

    }
  }


  const totalGave = members.reduce(
    (sum, member) =>
      sum + memberStats(member.id).gave,
    0
  );


  const totalGot = members.reduce(
    (sum, member) =>
      sum + memberStats(member.id).got,
    0
  );


  return (

    <>

      <Header
        title="Admin Dashboard"
        user={user}
        onLogout={onLogout}
      />


      <main className="max-w-7xl mx-auto p-4 space-y-5">


        {error && (

          <div className="bg-red-50 text-red-700 p-4 rounded-xl">
            {error}
          </div>

        )}


        {/* STATS */}

        <section className="grid md:grid-cols-3 gap-4">

          <div className="card bg-white rounded-2xl p-5">

            <p className="text-slate-500">
              Members
            </p>

            <p className="text-2xl font-bold mt-1">
              {members.length}
            </p>

          </div>


          <div className="card bg-white rounded-2xl p-5">

            <p className="text-slate-500">
              Maine diye
            </p>

            <p className="text-2xl font-bold mt-1">
              {money(totalGave)}
            </p>

          </div>


          <div className="card bg-white rounded-2xl p-5">

            <p className="text-slate-500">
              Mujhe mile
            </p>

            <p className="text-2xl font-bold mt-1">
              {money(totalGot)}
            </p>

          </div>

        </section>


        {/* ADD FORMS */}

        <section className="grid lg:grid-cols-2 gap-5">


          {/* MEMBER */}

          <div className="card bg-white rounded-2xl p-5">

            <h2 className="font-bold text-lg mb-4">
              Add Member
            </h2>


            <form
              onSubmit={addMember}
              className="space-y-3"
            >

              <input
                required
                placeholder="Member name"
                value={memberName}
                onChange={e =>
                  setMemberName(e.target.value)
                }
                className="w-full border rounded-xl px-4 py-3"
              />


              <input
                required
                type="email"
                placeholder="Member login email"
                value={memberEmail}
                onChange={e =>
                  setMemberEmail(e.target.value)
                }
                className="w-full border rounded-xl px-4 py-3"
              />


              <button
                disabled={loading}
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3"
              >
                Add Member
              </button>

            </form>

          </div>


          {/* ENTRY */}

          <div className="card bg-white rounded-2xl p-5">

            <h2 className="font-bold text-lg mb-4">
              Add Ledger Entry
            </h2>


            <form
              onSubmit={addEntry}
              className="space-y-3"
            >

              <select
                required
                value={selectedMember}
                onChange={e =>
                  setSelectedMember(e.target.value)
                }
                className="w-full border rounded-xl px-4 py-3"
              >

                <option value="">
                  Select member
                </option>

                {members.map(member => (

                  <option
                    key={member.id}
                    value={member.id}
                  >
                    {member.name}
                  </option>

                ))}

              </select>


              <select
                value={entryType}
                onChange={e =>
                  setEntryType(e.target.value)
                }
                className="w-full border rounded-xl px-4 py-3"
              >

                <option value="gave">
                  Maine diye
                </option>

                <option value="got">
                  Mujhe mile
                </option>

              </select>


              <input
                required
                min="0.01"
                type="number"
                step="0.01"
                placeholder="Amount ₹"
                value={amount}
                onChange={e =>
                  setAmount(e.target.value)
                }
                className="w-full border rounded-xl px-4 py-3"
              />


              <input
                placeholder="Note"
                value={note}
                onChange={e =>
                  setNote(e.target.value)
                }
                className="w-full border rounded-xl px-4 py-3"
              />


              <button
                disabled={loading}
                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3"
              >
                Save Entry
              </button>

            </form>

          </div>

        </section>


        {/* MEMBERS */}

        <section className="card bg-white rounded-2xl overflow-hidden">

          <div className="p-5 border-b">

            <h2 className="font-bold text-lg">
              Members
            </h2>

          </div>


          {members.length === 0 ? (

            <p className="p-6 text-slate-500">
              Abhi koi member nahi hai.
            </p>

          ) : (

            <div className="divide-y">

              {members.map(member => {

                const stats =
                  memberStats(member.id);

                return (

                  <div
                    key={member.id}
                    className="p-5 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4"
                  >

                    <div>

                      <h3 className="font-bold text-lg">
                        {member.name}
                      </h3>

                      <p className="text-sm text-slate-500">
                        {member.email}
                      </p>

                    </div>


                    <div className="flex flex-wrap gap-3 items-center text-sm">

                      <span>
                        Diye:
                        <b className="ml-1">
                          {money(stats.gave)}
                        </b>
                      </span>


                      <span>
                        Mile:
                        <b className="ml-1">
                          {money(stats.got)}
                        </b>
                      </span>


                      <span
                        className={
                          stats.net >= 0
                            ? "text-emerald-700"
                            : "text-red-700"
                        }
                      >

                        Balance:
                        <b className="ml-1">
                          {money(Math.abs(stats.net))}
                        </b>

                        <span className="ml-1">
                          {stats.net >= 0
                            ? "lene hain"
                            : "dene hain"}
                        </span>

                      </span>


                      <a
                        target="_blank"
                        rel="noopener noreferrer"
                        href={
                          "https://wa.me/?text=" +
                          encodeURIComponent(
                            "Hisaab Kitaab\n\n" +
                            "Member: " +
                            member.name +
                            "\n\n" +
                            "Balance: " +
                            money(Math.abs(stats.net)) +
                            " " +
                            (
                              stats.net >= 0
                                ? "lene hain"
                                : "dene hain"
                            )
                          )
                        }
                        className="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg"
                      >
                        WhatsApp
                      </a>

                    </div>

                  </div>

                );

              })}

            </div>

          )}

        </section>


        {/* LEDGER */}

        <section className="card bg-white rounded-2xl overflow-hidden">

          <div className="p-5 border-b">

            <h2 className="font-bold text-lg">
              Ledger
            </h2>

          </div>


          {entries.length === 0 ? (

            <p className="p-6 text-slate-500">
              Abhi koi ledger entry nahi hai.
            </p>

          ) : (

            <div className="divide-y">

              {entries.map(entry => {

                const member =
                  members.find(
                    m => m.id === entry.memberId
                  );

                return (

                  <div
                    key={entry.id}
                    className="p-4 flex flex-col sm:flex-row sm:justify-between gap-3"
                  >

                    <div>

                      <b>
                        {member?.name || "Member"}
                      </b>

                      <p className="text-sm text-slate-500">
                        {entry.note || "No note"}
                        {" · "}
                        {formatDate(entry.createdAt)}
                      </p>

                    </div>


                    <div
                      className={
                        entry.type === "gave"
                          ? "text-emerald-700"
                          : "text-red-700"
                      }
                    >

                      {entry.type === "gave"
                        ? "+"
                        : "−"}

                      {money(entry.amount)}


                      <button
                        onClick={() =>
                          deleteEntry(entry.id)
                        }
                        className="ml-4 text-xs text-red-600 hover:underline"
                      >
                        Delete
                      </button>

                    </div>

                  </div>

                );

              })}

            </div>

          )}

        </section>

      </main>

    </>

  );
}

function App() {

  const [user, setUser] =
    useState(null);

  const [mode, setMode] =
    useState("login");

  const [email, setEmail] =
    useState("");

  const [password, setPassword] =
    useState("");

  const [loading, setLoading] =
    useState(false);

  const [error, setError] =
    useState("");

  const [members, setMembers] =
    useState([]);

  const [entries, setEntries] =
    useState([]);

  const [currentMember, setCurrentMember] =
    useState(null);


  /*
  ========================================================
  LOAD ALL DATA - ADMIN
  ========================================================
  */

  async function loadAdminData() {

    if (!database) {
      return;
    }


    const membersSnapshot =
      await database.ref("members").once("value");


    const membersObject =
      membersSnapshot.val() || {};


    const memberArray =
      Object.entries(membersObject)
        .map(([id, data]) => ({
          id,
          ...data
        }))
        .sort(
          (a, b) =>
            String(a.name || "")
              .localeCompare(
                String(b.name || "")
              )
        );


    const entriesSnapshot =
      await database.ref("entries").once("value");


    const entriesObject =
      entriesSnapshot.val() || {};


    const entryArray =
      Object.entries(entriesObject)
        .map(([id, data]) => ({
          id,
          ...data
        }))
        .sort(
          (a, b) =>
            Number(b.createdAt || 0) -
            Number(a.createdAt || 0)
        );


    setMembers(memberArray);
    setEntries(entryArray);
  }


  /*
  ========================================================
  LOAD MEMBER DATA
  ========================================================
  */

  async function loadMemberData(user) {

    const snapshot =
      await database
        .ref("members")
        .orderByChild("email")
        .equalTo(
          user.email.toLowerCase()
        )
        .once("value");


    const data =
      snapshot.val();


    if (!data) {

      setError(
        "Is email ke liye member account nahi mila."
      );

      return;
    }


    const first =
      Object.entries(data)[0];


    const member = {
      id: first[0],
      ...first[1]
    };


    setCurrentMember(member);


    const entriesSnapshot =
      await database
        .ref("entries")
        .orderByChild("memberId")
        .equalTo(member.id)
        .once("value");


    const entriesObject =
      entriesSnapshot.val() || {};


    const memberEntries =
      Object.entries(entriesObject)
        .map(([id, data]) => ({
          id,
          ...data
        }))
        .sort(
          (a, b) =>
            Number(b.createdAt || 0) -
            Number(a.createdAt || 0)
        );


    setEntries(memberEntries);

    setMode("member");
  }


  /*
  ========================================================
  REALTIME LISTENERS
  ========================================================
  */

  useEffect(() => {

    if (!auth || !database) {
      return;
    }


    const unsubscribe =
      auth.onAuthStateChanged(async currentUser => {

        setUser(currentUser);


        if (!currentUser) {

          setMode("login");
          setMembers([]);
          setEntries([]);
          setCurrentMember(null);

          return;
        }


        try {

          const currentEmail =
            currentUser.email
              .toLowerCase();


          const adminEmail =
            ADMIN_EMAIL
              .trim()
              .toLowerCase();


          if (
            adminEmail &&
            currentEmail === adminEmail
          ) {

            setMode("admin");


            /*
            Realtime members listener
            */

            const membersRef =
              database.ref("members");


            const entriesRef =
              database.ref("entries");


            const membersHandler =
              snapshot => {

                const object =
                  snapshot.val() || {};


                const array =
                  Object.entries(object)
                    .map(([id, data]) => ({
                      id,
                      ...data
                    }))
                    .sort(
                      (a, b) =>
                        String(a.name || "")
                          .localeCompare(
                            String(b.name || "")
                          )
                    );


                setMembers(array);
              };


            const entriesHandler =
              snapshot => {

                const object =
                  snapshot.val() || {};


                const array =
                  Object.entries(object)
                    .map(([id, data]) => ({
                      id,
                      ...data
                    }))
                    .sort(
                      (a, b) =>
                        Number(b.createdAt || 0) -
                        Number(a.createdAt || 0)
                    );


                setEntries(array);
              };


            membersRef.on(
              "value",
              membersHandler
            );


            entriesRef.on(
              "value",
              entriesHandler
            );


            return;
          }


          /*
          Member
          */

          await loadMemberData(
            currentUser
          );


        } catch (error) {

          setError(error.message);

        }

      });


    return () => {

      unsubscribe();

      if (database) {

        database
          .ref("members")
          .off();

        database
          .ref("entries")
          .off();

      }

    };

  }, []);


  /*
  ========================================================
  LOGIN
  ========================================================
  */

  async function handleLogin(event) {

    event.preventDefault();

    setError("");

    setLoading(true);


    try {

      await auth.signInWithEmailAndPassword(
        email.trim().toLowerCase(),
        password
      );

    } catch (error) {

      setError(
        error.message
          .replace("Firebase: ", "")
      );

    } finally {

      setLoading(false);

    }

  }


  /*
  ========================================================
  LOGOUT
  ========================================================
  */

  async function handleLogout() {

    await auth.signOut();

    setEmail("");
    setPassword("");
    setMembers([]);
    setEntries([]);
    setCurrentMember(null);
  }


  /*
  ========================================================
  RELOAD
  ========================================================
  */

  async function reload() {

    await loadAdminData();

  }


  /*
  ========================================================
  RENDER
  ========================================================
  */

  if (!firebaseConfigured) {

    return <SetupScreen />;

  }


  if (!user) {

    return (

      <LoginScreen
        email={email}
        setEmail={setEmail}
        password={password}
        setPassword={setPassword}
        onLogin={handleLogin}
        loading={loading}
        error={error}
      />

    );

  }


  if (mode === "admin") {

    return (

      <AdminDashboard
        user={user}
        members={members}
        entries={entries}
        onLogout={handleLogout}
        reload={reload}
        error={error}
        setError={setError}
      />

    );

  }


  if (mode === "member" && currentMember) {

    return (

      <MemberPassbook
        user={user}
        member={currentMember}
        entries={entries}
        onLogout={handleLogout}
      />

    );

  }


  return (

    <div className="min-h-screen flex items-center justify-center">
      <div className="text-slate-500">
        Loading...
      </div>
    </div>

  );

}


/* ======================================================
   START REACT
====================================================== */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App />
  );

</script>

</body>
</html>
